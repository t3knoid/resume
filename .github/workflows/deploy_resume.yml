name: Generate PDF of Resume and upload to Azure Storage

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'lighthouse-report.html'
      - 'README.md'
      - '.venv/**'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Generate PDF of standard resume and upload to Azure Storage
      - name: Generate and Upload PDF
        id: pdfgen
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          RESUME_PDF_TOKEN: ${{ secrets.RESUME_PDF_TOKEN }}
        run: python3 scripts/htmtopdf.py

      # Step 5: Commit and push index.html changes (last-updated date, download link)
      - name: Commit and Push index.html changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update index.html"
            git push
          fi

      # Step 6: Prepare and deploy GitHub Pages artifact
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          find . -maxdepth 1 -type f -name '*.html' -exec cp {} dist/ \;
          cp robots.txt dist/
          cp -R assets dist/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
